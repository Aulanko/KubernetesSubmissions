name: Delete Environment

on:
  delete

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  delete-namespace:
    name: Delete Environment
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch' && github.event.ref != 'master'
    environment: GKE_PROJECT
    concurrency:
      group: deploy-${{ github.event.ref }}
      cancel-in-progress: true

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GKE_CLUSTER: dwk-cluster
      GKE_ZONE: europe-north1-b
      TARGET_NAMESPACE: ${{ github.event.ref }}

    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: 'Delete namespace'
        run: kubectl delete namespace "$TARGET_NAMESPACE" --ignore-not-found