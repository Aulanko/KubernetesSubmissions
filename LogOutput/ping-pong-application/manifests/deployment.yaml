apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: pingpong:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: shared-volume
              mountPath: /usr/src/app/counter
          ports:
            - containerPort: 8080
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: pv-claim-for-logoutput-and-ping-pong